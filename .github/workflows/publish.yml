name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Publication target
        type: choice
        default: all
        options:
          - all
          - library
          - desktop-native-unix
          - desktop-native-windows
      release_ref:
        description: Tag or commit to publish (defaults to the workflow ref)
        type: string
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  XCODE_VERSION: "26.4"
  APPLE_SDK_VERSION: "26.4"
  ORG_GRADLE_PROJECT_mavenCentralAutomaticPublishing: "true"

jobs:
  publish-library:
    name: Publish KMP Library
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'library'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --force

      - name: Set up Python for Android ELF verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Select Xcode 26.4
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            XCODE_APP="$(find /Applications -maxdepth 1 -name "Xcode_${XCODE_VERSION}*.app" | head -n 1)"
          fi
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version)" = "$APPLE_SDK_VERSION"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "$APPLE_SDK_VERSION"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "$APPLE_SDK_VERSION"

      # Installs the pinned nightly + rust-src, rebuilds std with panic_abort,
      # and verifies both iOS static libraries before copying them.
      - name: Prepare iOS Rust artifacts
        run: bash prepare-ios-rust.sh

      - name: Prepare Android Rust artifacts
        run: bash prepare-android-rust.sh

      - name: Prepare macOS Rust artifacts
        run: bash prepare-jvm-rust.sh darwin-aarch64

      - name: Run JVM and iOS simulator regression tests
        run: ./gradlew :library:jvmTest :library:iosSimulatorArm64Test --stacktrace

      - name: Build and verify Android AAR
        run: |
          ./gradlew :library:bundleAndroidMainAar --stacktrace
          python3 external/RaTeX/scripts/verify_android_elf.py library/build/outputs/aar/library.aar

      - name: Publish library to Maven Central
        run: ./gradlew :library:publishAllPublicationsToMavenCentralRepository --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  publish-desktop-native-unix:
    name: Publish Desktop Native (macOS + Linux)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'desktop-native-unix'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig and cargo-zigbuild
        run: |
          brew install zig
          cargo install cargo-zigbuild --locked --force

      - name: Select Xcode 26.4
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            XCODE_APP="$(find /Applications -maxdepth 1 -name "Xcode_${XCODE_VERSION}*.app" | head -n 1)"
          fi
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version)" = "$APPLE_SDK_VERSION"

      - name: Publish desktop native libraries to Maven Central
        run: ./gradlew publishSupportedDesktopNativePublicationsToMavenCentralRepository --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  publish-desktop-native-windows:
    name: Publish Desktop Native (Windows)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'desktop-native-windows'
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Bash
        shell: pwsh
        run: bash --version

      - name: Publish desktop native libraries to Maven Central
        shell: pwsh
        run: .\gradlew.bat publishSupportedDesktopNativePublicationsToMavenCentralRepository --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
